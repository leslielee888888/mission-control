<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: oklch(98% 0.004 250);
      --surface: oklch(100% 0 0);
      --surface-2: oklch(96% 0.005 250);
      --border: oklch(90% 0.006 250);
      --text: oklch(22% 0.02 250);
      --text-2: oklch(48% 0.015 250);
      --text-3: oklch(64% 0.01 250);
      --accent: oklch(55% 0.16 230);
      --accent-dark: oklch(46% 0.16 230);
      --accent-2: oklch(94% 0.03 230);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      background-image: radial-gradient(oklch(90% 0.006 250) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-dark); text-decoration: underline; }
    input {
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      width: 100%;
    }
    input::placeholder { color: var(--text-3); }
    button {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; display: flex; align-items: center; justify-content: center;">
  <div style="width: 400px; display: flex; flex-direction: column; gap: 28px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.75">
        <circle cx="12" cy="12" r="9"></circle>
        <circle cx="12" cy="12" r="2.5" fill="var(--accent)" stroke="none"></circle>
        <path d="M12 3 a9 4 0 0 1 0 18 a9 4 0 0 1 0 -18" transform="rotate(35 12 12)"></path>
      </svg>
      <div style="font-size: 18px; font-weight: 700; letter-spacing: 0.01em;">Mission Control</div>
      <div style="font-size: 13px; color: var(--text-2);">Sign in to your organization</div>
    </div>

    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 1px 2px oklch(0% 0 0 / 0.04);">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 12px; font-weight: 600; color: var(--text-2);">Email</label>
        <input type="text" placeholder="jordan.lee@aurora-deepspace.example" value="jordan.lee@aurora-deepspace.example" />
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 12px; font-weight: 600; color: var(--text-2);">Password</label>
        <input type="text" placeholder="••••••••••" value="••••••••••" />
      </div>
      <button style="background: var(--accent); color: white; padding: 11px 16px; margin-top: 4px;">Sign in</button>
      <div style="font-size: 12px; color: var(--text-3);">Wrong credentials return a plain "email or password is incorrect" — never which one was wrong.</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;">
      <div style="flex: 1; height: 1px; background: var(--border);"></div>
      <div>same account, other client</div>
      <div style="flex: 1; height: 1px; background: var(--border);"></div>
    </div>

    <div style="background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; display: flex; align-items: flex-start; gap: 10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="1.75" style="flex: none; margin-top: 1px;">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
        <path d="M7 9l3 3-3 3M13 15h4"></path>
      </svg>
      <div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--text);">missionctl login &lt;email&gt; &lt;password&gt;</div>
        <div style="font-size: 12px; color: var(--text-3); margin-top: 3px;">The CLI uses the exact same login endpoint — one credential, both clients.</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
