# Fast-path trigger for the PR Review Dashboard (PRD v2, FR-2).
#
# Runs on the self-hosted runner that lives on Leslie's LAN (docker-compose
# `actions-runner` service, label `pr-review-trigger`) and makes ONE call to the
# dashboard's trigger endpoint. No checkout, no build — the dashboard fetches
# the diff itself over the GitHub API. If this job fails (runner offline,
# endpoint down) nothing is lost: the poller still picks the PR up on its next
# cycle, so this is never a required check (continue-on-error, and never add
# it to branch protection).
#
# SECURITY — this repo is PUBLIC, unlike ai-docs/leslie-awesome-skills (this
# pattern's origin), which are private. A self-hosted runner on `pull_request`
# is a known arbitrary-code-execution vector on a public repo: for that
# event, GitHub evaluates the workflow file FROM THE PR's OWN HEAD REF, so a
# fork PR can rewrite this file's steps (or the `if:` guard below) and have
# them run on this LAN-connected runner. Two layers, since the in-file guard
# alone is attacker-editable in exactly this scenario:
#  1. GitHub's own platform gate (not configurable weaker on a personal
#     account's public repo): a first-time contributor's workflow run is
#     always held for manual approval in the Actions tab, evaluated BEFORE
#     any job dispatches — this is the real backstop, independent of
#     anything in this file.
#  2. Defense in depth below: `head.repo.full_name == github.repository`
#     skips any PR whose head branch isn't in this same repo (i.e. any
#     fork), so a repeat contributor's fork PR (past the one-time approval
#     gate) still can't reach the runner. Kept even though a sufficiently
#     motivated repeat contributor could edit this guard out of their own
#     fork's copy — it stops everything else.
name: PR review trigger

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: pr-review-trigger-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trigger:
    # `draft == false`: the poller's own draft exclusion (FR-1) — relies
    # solely on this guard, not on the event `types:` list above (both
    # `opened` and `synchronize` fire for drafts too).
    # `head.repo.full_name == github.repository`: never run for a fork PR
    # — see the SECURITY note above.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pr-review-trigger]
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - name: Enqueue review on the dashboard
        env:
          TRIGGER_URL: ${{ vars.PR_REVIEW_TRIGGER_URL }}
          TRIGGER_TOKEN: ${{ secrets.PR_REVIEW_TRIGGER_TOKEN }}
          OWNER: ${{ github.event.repository.owner.login }}
          REPO: ${{ github.event.repository.name }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          : "${TRIGGER_URL:?set the PR_REVIEW_TRIGGER_URL repository variable — see this repo's Settings > Secrets and variables > Actions}"
          : "${TRIGGER_TOKEN:?set the PR_REVIEW_TRIGGER_TOKEN repository secret}"
          body=$(jq -n --arg owner "$OWNER" --arg repo "$REPO" --argjson number "$NUMBER" \
            '{owner: $owner, repo: $repo, number: $number}')
          echo "POST $TRIGGER_URL for $OWNER/$REPO#$NUMBER"
          # This repo is public — its Actions logs are too — so the response
          # body (which could carry more detail than intended on a dashboard
          # error) is discarded rather than echoed; the exit code is enough
          # to know whether the call landed.
          curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 2 --retry-delay 2 --retry-connrefused \
            -H "Authorization: Bearer $TRIGGER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body" \
            -o /dev/null \
            "$TRIGGER_URL"
          echo "enqueued"
