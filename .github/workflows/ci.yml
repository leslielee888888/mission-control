name: CI

# The PR review gate: every pull request into main or a feature/<prd-slug>
# branch must pass lint + tests for both the backend and the showcase SPA
# before it can merge. Mirrors exactly what every task in this build already
# ran by hand (ruff check/format, pytest; tsc -b + oxlint + vite build) -
# this just makes it enforced instead of self-reported.
#
# `feature/**` (not the literal `feature/mission-control`) so this doesn't
# need editing for every future PRD's feature branch - the delivery
# workflow's branch shape is `main <- feature/<slug> <- task/<slug>-t<n>`,
# generically, not just this one build's slug. A `pull_request`'s branch
# filter matches its *base* branch, so a task/<slug>-t<n> -> feature/<slug>
# PR is already covered without task/** needing to be listed here too.

on:
  pull_request:
    branches: [main, "feature/**"]
  push:
    branches: [main, "feature/**"]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest
        run: pytest -v

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: lint (oxlint)
        run: npm run lint

      - name: typecheck + build (tsc -b && vite build)
        run: npm run build
