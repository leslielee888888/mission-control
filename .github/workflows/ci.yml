name: CI

# The PR review gate: every pull request into main or feature/mission-control
# must pass lint + tests for both the backend and the showcase SPA before it
# can merge. Mirrors exactly what every task in this build already ran by
# hand (ruff check/format, pytest; tsc -b + oxlint + vite build) - this just
# makes it enforced instead of self-reported.

on:
  pull_request:
    branches: [main, feature/mission-control]
  push:
    branches: [main, feature/mission-control]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest
        run: pytest -v

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: lint (oxlint)
        run: npm run lint

      - name: typecheck + build (tsc -b && vite build)
        run: npm run build
