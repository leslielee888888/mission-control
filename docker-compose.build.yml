# Local-build override - fallback only, when GHCR is unreachable or an
# untagged local change needs testing before it's pushed.
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8100}
